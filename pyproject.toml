[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "openhealth-bridge"
version = "0.1.0"
description = "Backend base para gestionar incidentes y casos ART."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.4,<2.0.0",
  "asyncpg>=0.30.0,<0.31.0",
  "fastapi>=0.116.1,<0.117.0",
  "PyJWT[crypto]>=2.10.1,<3.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "sqlalchemy>=2.0.42,<3.0.0",
  "uvicorn[standard]>=0.35.0,<0.36.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0,<0.22.0",
  "httpx>=0.28.1,<0.29.0",
  "mypy>=1.17.1,<2.0.0",
  "pre-commit>=4.2.0,<5.0.0",
  "pytest>=8.4.1,<9.0.0",
  "ruff>=0.12.4,<0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openhealth_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
pretty = true
